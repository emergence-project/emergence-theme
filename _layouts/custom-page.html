---
layout: base
---

<!-- Background -->
<div class="page-bg"></div>

<!-- Top Navigation -->
{% include nav.html %}

<!-- Page Container -->
<main class="custom-page-container page-{{ page.slug }}" id="main-content">
  <header class="page-hero">
    <h1 class="page-title">{{ page.title | downcase }}<span class="dot">.</span></h1>
    {% if page.description %}
      <p class="page-subtitle">{{ page.description }}</p>
    {% endif %}
  </header>

  <div class="page-content">
    {{ content }}
  </div>
</main>
