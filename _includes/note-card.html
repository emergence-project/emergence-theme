{% assign post = include.note %}
<a href="{{ post.url | relative_url }}" class="note-entry">
  <span class="note-entry__title">{{ post.title }}</span>
  {% if post.date %}
    <span class="note-entry__date">{{ post.date | date: "%b %d, %Y" }}</span>
  {% endif %}
  {% if post.tags.size > 0 %}
    <ul class="note-entry__tags" aria-label="Note topics">
      {% for tag in post.tags limit: 4 %}
        <li>{{ tag }}</li>
      {% endfor %}
    </ul>
  {% endif %}
</a>
